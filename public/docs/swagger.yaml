          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: 'Pendidikan'
      responses:
        '201':
          description: Sektor berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "succes"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      nama:
                        type: string
                        example: "Pendidikan"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 400
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Data tidak ditemukan"
  /sektor/{id}:
    get:
      tags:
        - Sektor
      summary: Mendapatkan detail sektor
      description: API untuk mendapatkan detail sektor berdasarkan ID
      security:
        - BearerAuth: []
      parameters:
        - name: id

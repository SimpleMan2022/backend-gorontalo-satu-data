                    example: true
                  message:
                    type: string
                    example: "succes"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      nama:
                        type: string
                        example: "Pendidikan"
        '404':
          description: Sektor tidak ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 404
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Data tidak ditemukan"
    patch:
      tags:
        - Sektor
      summary: Mengupdate sektor
      description: API untuk mengupdate data sektor berdasarkan ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: "Infrastruktur"
      responses:
        '200':
          description: Sektor berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "succes"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      nama:
                        type: string
                        example: "Infrastruktur"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 400
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Data tidak valid"
    delete:
      tags:
        - Sektor
      summary: Menghapus sektor
      description: API untuk menghapus sektor berdasarkan ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Sektor berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data berhasil dihapus"
        '404':
          description: Sektor tidak ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 404
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unauthenticated"


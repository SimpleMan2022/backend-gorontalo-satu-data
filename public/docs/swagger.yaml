        content:
          application/json:
            schema:
              type: object
              properties:
                tahun:
                  type: string
                  example: "2024"
                nama:
                  type: string
                  example: "Triwulan 1"
      responses:
        "201":
          description: Antar waktu berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "data antar waktu berhasil dibuat"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
  /antar-waktu/edit{id}:
    patch:
      tags:
        - Antar Waktu
      summary: Mengupdate antar waktu
      description: API untuk mengupdate data antar waktu berdasarkan ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

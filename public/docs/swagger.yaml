      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tahun:
                  type: string
                  example: "2024"
                nama:
                  type: string
                  example: "Triwulan 2"
      responses:
        "200":
          description: Antar waktu berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean

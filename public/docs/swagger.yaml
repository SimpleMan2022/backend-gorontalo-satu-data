  /indikator:
    get:
      tags:
        - Indikator
      summary: Mendapatkan daftar indikator
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/SearchParam"

        - name: sektor_id
          in: query
          description: Filter berdasarkan ID sektor
          required: false
          schema:
            type: integer

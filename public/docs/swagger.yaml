    MultiDataNotFoundResponse:
      type: object
      properties:
        code:
          type: number
          example: 404
        status:
          type: boolean
          example: false
        message:
          type: string
          example: "Data dengan ID berikut tidak ditemukan: 6, 4"

    BadRequestResponse:
      type: object
      properties:
        code:
          type: number
          example: 400
        status:
          type: boolean
          example: false
        message:
          type: string
          example: "Data gagal dibuat"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              example: "The nama field must be at least 3 characters."

  parameters:
    PageParam:
      name: page
      in: query
      description: Halaman yang akan diambil
      required: false
      schema:
        type: integer
        default: 1
        example: 1
    PerPageParam:
      name: per_page
      in: query
      description: Jumlah data per halaman
      required: false
      schema:
        type: integer
        default: 10
        example: 10

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: "Agregat sebaran fasilitas kesehatan negeri"
                sektor_id:
                  type: integer
                  example: 3
                antar_waktu_id:
                  type: integer
                  example: 3
                opd_provinsi_id:
                  type: integer
                  example: 2
                status:
                  type: string
                  example: "public"
      responses:
        "201":
          description: Indikator berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:

                  message:
                    type: string
                    example: "Data sektor berhasil diubah"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "404":
          description: Data sektor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataNotFoundResponse"
  /sektor/delete{id}:
    delete:
      tags:
        - Sektor
      summary: Menghapus sektor
      description: API untuk menghapus sektor berdasarkan ID
      security:

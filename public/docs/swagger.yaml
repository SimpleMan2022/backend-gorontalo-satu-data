openapi: "3.0.2"
info:
  title: Gorontalo Satu Data
  version: "1.0"
servers:
  - url: http://36.67.194.180/backend/api
    description: Production Server
  - url: http://localhost:8000/api
    description: Development Server

tags:
  - name: Authentication
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Melakukan autentikasi pengguna
      description: API untuk mendapatkan token autentikasi pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "farel"
                password:
                  type: string
                  example: "12345678"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login berhasil"
                  data:
                    type: object
                    properties:
                      token_type:
                        type: string
                        example: "Bearer"
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Mengambil data pengguna yang sedang login
      description: API untuk mendapatkan data pengguna yang sedang login berdasarkan token autentikasi
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "succes"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: "admin"
                      nama_lengkap:
                        type: string
                        example: "-"
                      email:
                        type: string
                        example: "admin@example.com"
                      jabatan:
                        type: string
                        example: "admin"
                      role:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: "admin"
                          permissions:
                            type: array
                            items:
                              type: string
                            example: ["create-sektor", "update-sektor"]
                      permissions:
                        type: array
                        items:
                          type: string
                        example: ["create-sektor", "update-sektor"]
                      opd:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          tingkat:
                            type: string
                            example: "opd_provinsi"
                          nama:
                            type: string
                            example: "Dinas Pendidikan"
                          logo: 
                            type: string
                            example: "logo/dinas_pendidikan.png"
                          lokasi:
                            type: string
                            example: "Jl. Pendidikan No. 1"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
  /auth/login-enumerator:
    post:
      tags:
        - Authentication
      summary: Melakukan autentikasi enumerator
      description: API untuk mendapatkan token autentikasi enumerator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "farel"
                password:
                  type: string
                  example: "12345678"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login berhasil"
                  data:
                    type: object
                    properties:
                      token_type:
                        type: string
                        example: "Bearer"
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Melakukan logout pengguna
      description: API untuk logout pengguna dengan menghapus token autentikasi
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logout berhasil"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Lupa password
      description: API untuk melakukan lupa password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "user@example.com"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Email reset password telah dikirim"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: API untuk melakukan reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "user@example.com"
                password:
                  type: string
                  example: "12345678"
                password_confirmation:
                  type: string
                  example: "12345678"
                token:
                  type: string
                  example: "eyJhbGciOi"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password berhasil direset"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Mengganti password
      description: API untuk mengganti password
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                  example: "12345678"
                new_password:
                  type: string
                  example: "12345678"
                confirm_password:
                  type: string
                  example: "12345678"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password berhasil diubah"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
  /auth/change-profile:
    put:
      tags:
        - Authentication
      summary: Mengganti profile
      description: API untuk mengganti profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "farel"
                nama_lengkap:
                  type: string
                  example: "Farel"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profile berhasil diubah"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse" 
  /sektor:
    get:
      tags:
        - Sektor
      summary: Mendapatkan semua data sektor
      description: API untuk mendapatkan semua data sektor
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: Detail sektor berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data sektor berhasil diambil"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2
                        nama:
                          type: string
                          example: "Kesehatan"
                        logo:
                          type: string
                          example: "http://gsd/foto.webp"
                        opd_provinsi:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              nama:
                                type: string
                                example: "Dinas Pendidikan"
                              lokasi:
                                type: string
                                example: "Jl. Pendidikan No. 1"
                              logo:
                                type: string
                                example: "http://gsd/foto.webp"
                        created_at:
                          type: string
                          example: "2024-10-16T01:32:59.000000Z"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

        "404":
          description: Data sektor masih kosong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataNotFoundResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
    post:
      tags:
        - Sektor
      summary: Menambahkan sektor baru
      description: API untuk menambahkan sektor baru
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: "Pendidikan"
                logo:
                  type: string
                  example: "http://gsd/foto.webp"
      responses:
        "201":
          description: Sektor berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 201
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "data sektor berhasil dibuat"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
  /sektor/{id}:
    get:
      tags:
        - Sektor
      summary: Mendapatkan detail sektor
      description: API untuk mendapatkan detail sektor berdasarkan ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Detail sektor berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data sektor berhasil diambil"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 19
                      nama:
                        type: string
                        example: Pendidikan
                      logo:
                        type: string
                        example: /logo/sector/pendidikan.webp
                      opd_provinsi:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 7
                            nama:
                              type: string
                              example: Satpol PP Provinsi
                            lokasi:
                              type: string
                              example: Tamalate
                            logo:
                              type: string
                              example: logo/dhApOcziKdilLbEJ5tJICH4b8uUIkW4XIMdhX7Bi.webp
                      created_at:
                        type: string
                        format: date-time
                        example: "2024-12-04T01:52:07.000000Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "404":
          description: Data sektor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataNotFoundResponse"
  /sektor/edit{id}:
    patch:
      tags:
        - Sektor

                          type: string
                          format: date-time
                          example: "2024-10-13T12:30:11.000000Z"
                        updated_at:
                          type: string
                          format: date-time
                          example: "2024-10-13T12:30:11.000000Z"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

        "401":

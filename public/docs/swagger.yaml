          style: form
          explode: false
      responses:
        "200":
          description: Antar waktu berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data antar waktu berhasil dihapus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "404":
          description: Data antar waktu tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiDataNotFoundResponse"
  /indikator:
    get:
      tags:
        - Indikator
      summary: Mendapatkan daftar indikator
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
        - $ref: "#/components/parameters/SearchParam"

        - name: sektor_id
          in: query
          description: Filter berdasarkan ID sektor
          required: false
          schema:
            type: integer
            example: 9
        - name: opd_provinsi_id
          in: query
          description: Filter berdasarkan ID OPD Provinsi
          required: false
          schema:
            type: integer
            example: 1
        - name: antar_waktu_id
          in: query
          description: Filter berdasarkan ID Antar Waktu
          required: false
          schema:
            type: integer
            example: 6
      responses:
        "200":
          description: Berhasil mendapatkan daftar indikator
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data indikator berhasil diambil"
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 7
                        nama:
                          type: string
                          example: "Sebaran Jumlah Rumah Sakit dengan kondisi bangunan sedang"
                        sektor:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 9
                            nama:
                              type: string
                              example: "kesehatan"
                        antar_waktu:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 6
                            tahun:
                              type: string
                              example: "2022"
                            nama:
                              type: string
                              example: "Triwulan 5"
                        opd_provinsi:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            nama:
                              type: string
                              example: "Dinas Pendidikan"
                            lokasi:
                              type: string
                              example: "Jl. Pendidikan No. 1"
                        variabel:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              nama:
                                type: string
                                example: "Nama Sekolah"
                        subjek:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                example: 1
                              nama:
                                type: string
                                example: "Kabupaten"
                        status:
                          type: string
                          example: "pending"
                        created_at:
                          type: string
                          format: date-time
                          example: "2024-10-13T12:30:11.000000Z"
                        updated_at:
                          type: string
                          format: date-time
                          example: "2024-10-13T12:30:11.000000Z"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "404":
          description: Data indikator masih kosong
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyDataResponse"
    post:
      tags:
        - Indikator
      summary: Menambahkan indikator baru
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: "Agregat sebaran fasilitas kesehatan negeri"
                sektor_id:
                  type: integer
                  example: 3
                antar_waktu_id:
                  type: integer
                  example: 3
                opd_provinsi_id:
                  type: integer
                  example: 2
                status:
                  type: string
                  example: "public"
      responses:
        "201":
          description: Indikator berhasil ditambahkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  status:

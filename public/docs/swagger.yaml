openapi: '3.0.2'
info:
  title: Gorontalo Satu Data
  version: '1.0'
servers:
  - url: https://api.gsd.my.id/v1
    description: Production Server
  - url: http://localhost:8000/api
    description: Development Server

tags:
  - name: Authentication
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Melakukan autentikasi pengguna
      description: API untuk mendapatkan token autentikasi pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: 'farel'
                password:
                  type: string
                  example: '12345678'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login berhasil"
                  data:
                    type: object
                    properties:
                      token_type:
                        type: string
                        example: "Bearer"
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 400
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Login Gagal"
                  data:
                    type: object
                    properties:
                      username:
                        type: string
                        example: "The username field is required"
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Mengambil data pengguna yang sedang login
      description: API untuk mendapatkan data pengguna yang sedang login berdasarkan token autentikasi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "succes"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      username:
                        type: string
                        example: 'admin'
                      email:
                        type: string
                        example: 'admin@example.com'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 401
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unauthenticated"
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Melakukan logout pengguna
      description: API untuk logout pengguna dengan menghapus token autentikasi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logout berhasil"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 401
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Unauthenticated"

  /sektor:
    get:
      tags:
        - Sektor
      summary: Mendapatkan semua data sektor
      description: API untuk mendapatkan semua data sektor
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detail sektor berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          total:
                            type: number
                            example: 1
                          per_page:
                            type: number
                            example: 10
                          current_page:
                            type: number
                            example: 1
                          total_pages:
                            type: number
                            example: 1
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 2
                            nama:
                              type: string
                              example: "Kesehatan"
                            created_at:
                              type: string
                              example: "07 October 2024"
        '500':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 400
                  status:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Data masih kosong"
    post:
      tags:
        - Sektor
      summary: Menambahkan sektor baru
      description: API untuk menambahkan sektor baru
      security:
        - BearerAuth: []
      requestBody:
        required: true

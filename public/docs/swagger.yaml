          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                  example: "Pendidikan"
                logo:
                  type: string
                  example: "http://gsd/foto.webp"
      responses:
        "200":
          description: Data sektor berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data sektor berhasil diubah"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "404":
          description: Data sektor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataNotFoundResponse"
  /sektor/delete{id}:
    delete:
      tags:
        - Sektor
      summary: Menghapus sektor
      description: API untuk menghapus sektor berdasarkan ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Sektor berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data sektor berhasil dihapus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "404":
          description: Data sektor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataNotFoundResponse"
  /sektor/multi-delete:
    delete:
      tags:
        - Sektor
      summary: Menghapus banyak sektor
      description: API untuk menghapus banyak sektor berdasarkan ID
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: array
            items:
              type: integer
            example: [1, 2]
          style: form
          explode: false
      responses:
        "200":
          description: Sektor berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  status:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Data sektor berhasil dihapus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "404":
          description: Data sektor tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiDataNotFoundResponse"
